[SETTINGS]
;[Real Visor] General constraint
VIEW_LOCK = 0 ; View lock mode; “Car” is 0, “Filter” is 1, “Horizon” is 2
HORIZON_LOCK_STRENGTH = 0.5 ; Horizon lock strength when VIEW_LOCK is set to Horizon
VIEW_FILTER_TIME = 0.20 ; *removed View filtering time
POSITION_MULT = 1.0 ; Master multiplier for all physical head position movement ; from 0.000 to 20.000;
ROTATION_MULT = 1.0 ; Master multiplier for all physical head rotation movement ; from 0.000 to 20.000;

[PROFILE]
;[Real Visor] Change Profile
PRF_POSITION = 0 ; Position Profile ; "Basic" is 0, "Alternative" is 1

[POSITION]
;[Real Visor] Additional Camera Transform
PITCH_VIEW = 0.00 ; pitch; from -45.00° to 45.00;
ROLL_VIEW = 0.00 ; roll ; from -45.00° to 45.00;
YAW_VIEW = 0.00 ; yaw ; from -45.00° to 45.00;
X_OFFSET = 0.000 ; Additional head position offset along the local side axis in meters	; from -1.000 m to 1.000;
Y_OFFSET = 0.000 ; Additional head position offset along the local look axis in meters	; from -1.000 m to 1.000;
Z_OFFSET = 0.000 ; Additional head position offset along the local up axis in meters	; from -1.000 m to 1.000;

[POSITION_PROFILE2]
;[Real Visor] Additional Camera Transform Profile 2 ( e.g. F1 TV Visor Cam )
PITCH_VIEW = -4.00 ; pitch; from -45.00° to 45.00;
ROLL_VIEW = 10.00 ; roll ; from -45.00° to 45.00;
YAW_VIEW = 6.00 ; yaw ; from -45.00° to 45.00;
X_OFFSET = 0.090 ; Additional head position offset along the local side axis in meters	; from -1.000 m to 1.000;
Y_OFFSET = -0.120 ; Additional head position offset along the local look axis in meters	; from -1.000 m to 1.000;
Z_OFFSET = 0.040 ; Additional head position offset along the local up axis in meters	; from -1.000 m to 1.000;

[HIDE]
;[Real Visor] Hide Models
HIDDEN = 0 ; Driver visibility mode: 0 = Show steering and arms, 1 = Hide arms, 2 = Hide steering;“Driver ON Wheel ON” is 0, “Driver OFF Wheel ON” is 1, “Driver OFF Wheel OFF” is 2

[LOCK]
;[Real Visor] Lookup camera
LOCK_FUNCTION = 2 ; Look control mode: 0 = Joystick, 1 = Axis, 2 = Steering, 3 = Mouse X, 4 = Mouse XY; “Joystick” is 0, “Axis” is 1, “Steer” is 2, “Mouse X” is 3, “Mouse XY” is 4
LOOK_SENSITIVITY = 1.0 ; Look control sensitivity; from 0 to 2.00; hidden with LOCK_FUNCTION:1 or LOCK_FUNCTION:0
LOOK_CENTRE_REDUCTION = 0.0 ; Reduces steering/look movement around the centre position; from 0 to 1.00; hidden with LOCK_FUNCTION:1 or LOCK_FUNCTION:0 or LOCK_FUNCTION:2
BUTTON_LOOK = 0 ; Button-based look control

[SHIFT]
; [Real Visor] Head Rotation
STEER_YAW = 0.50 ; Steering influence on physical head yaw
STEER_RATE_START = 1.5 ; Steering-rate threshold where head-follow compensation begins
STEER_RATE_FULL = 5.0 ; Steering-rate threshold where head-follow response reaches minimum
STEER_SPIKE_RATE = 6.0 ; Steering-rate threshold above which sudden steering changes are rejected
STEER_YAW_HALFLIFE = 0.10 ; Head yaw response half-life in seconds
MAX_STEER_YAW = 12.0 ; Maximum steering-induced head yaw in degrees

LATERAL_ROLL = 1.00 ; Lateral G-force influence on head roll
MAX_HEAD_ROLL = 3.0 ; Maximum lateral G-induced head roll in degrees
HEAD_ROLL_HALFLIFE = 0.080 ; Head roll response half-life in seconds

LONGITUDINAL_PITCH = 0.50 ; Longitudinal G-force influence on head pitch
MAX_HEAD_PITCH = 2.0 ; Maximum longitudinal G-induced head pitch in degrees
HEAD_PITCH_HALFLIFE = 0.080 ; Head pitch response half-life in seconds

; [Real Visor] Head Position
SUSPENSION_BOB = 1.75 ; (Suspension movement influence on vertical head bob) Vertical Head Bob
SUSPENSION_BOB_SCALE = 0.15 ; Suspension bob multiplier
MAX_SUSPENSION_BOB = 0.015 ; Maximum suspension-induced vertical head movement in meters
SUSPENSION_BOB_HALFLIFE = 0.020 ; Suspension bob response half-life in seconds

LATERAL_SHIFT = 0.010 ; Lateral G-force influence on head position in meters per G
MAX_LATERAL_SHIFT = 0.035 ; Maximum lateral head displacement in meters
LATERAL_SHIFT_BLEND = 0.120 ; Inertial blending time for lateral head movement

FORWARD_SHIFT = 0.015 ; Longitudinal G-force influence on head position in meters per G
MAX_FORWARD_SHIFT = 0.040 ; Maximum forward/backward head displacement in meters
FORWARD_SHIFT_BLEND = 0.120 ; Inertial blending time for forward/backward head movement

BRAKE_VERTICAL_MULT = 0.35	; Power of G-force (Forward vector/Braking)
BRAKE_VERTICAL_MAX = 0.015	; Maximum Forward Power (Forward vector/Braking)

ACCEL_VERTICAL_MULT = 1.00	; Power of G-force (Forward vector/Accel)
ACCEL_VERTICAL_MAX = 0.005	; Maximum Forward Power (Forward vector/Accel)

VERTICAL_SHIFT = 0.008 ; Vertical G-force influence on head position in meters per G
MAX_VERTICAL_SHIFT = 0.025 ; Maximum vertical head displacement in meters
VERTICAL_SHIFT_BLEND = 0.120 ; Inertial blending time for vertical head movement


; [Real Visor] Optional Physics Response
STEER_SHIFT = 0.002 ; Small additional lateral head displacement caused by steering
LONGITUDINAL_PITCH_MULT = 1.0 ; Additional multiplier for braking/acceleration-induced head pitch